<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <link rel="stylesheet" href="./output.css">
    <link rel="stylesheet" href="./img.css">
</head>
<body>

    <div class="img text-white w-[100%] h-[250vh] md:h-[100vh] text-center md:text-start">
        <div class="flex-wrap items-center w-[] m-auto justify-between pt-10 mb-10 md:flex md:w-[80%] bg-white text-black pl-30 pb-10 md:pb-0 md:pl-0 md:text-white md:bg-transparent">
            <div class="flex gap-20 items-center">
                <p class="text-3xl font-bold">Physionic</p>
                <div class="flex gap-10 block md:hidden">
                    <img src="./icn search .icn-xs.png" alt="">
                    <img src="./icn shopping-cart .icn-xs.png" alt="">
                    <img src="./icn menu .icn-xs.png" alt="">
                </div>
            </div>
            <div class="flex-wrap text-gray-600 md:text-white gap-15 w-[20%] md:flex md:w-[30%] text-3xl ml-35 mt-20 md:text-[16px] md:ml-0 md:mt-0 md:gap-10">

                <p>Product</p>
                <p>Pricing</p>
                <p>Contact</p>
            </div>
            <button class="px-[20px] py-[10px] bg-[#23A6F0] rounded-[5px] text-white gap-[10px] items-center flex hidden md:block">
                Get Quote Now
            </button>
        </div>
        <div class="flex-wrap w-[80%] m-auto justify-between items-center md:flex ">
            <div>
                <p class="text-6xl md:text-8xl">Meet the Best <br> Hospital</p><br>
                <p>We know how large objects will act, 
                <br>but things on a small scale.</p><br>
                <div>
                    <button class="px-[20px] py-[10px] bg-[#23A6F0] rounded-[5px] text-white rounded-[50px]">Get Quote Now</button>
                    <button class="px-[20px] py-[10px] bg-transparent outline-1 rounded-[5px] text-white rounded-[50px]">Get Quote Now</button>
                </div>
            </div>
            <div class="w-[330px] h-[650px] bg-white rounded-2xl text-black px-5 ml-[20%] mt-15 md:ml-0 md:mt-0">
                <p class="text-3xl mb-10">Book Appointment</p>

                <p>Name *</p><br>
                <input class="w-[246px] h-[50px] px-[10px] bg-[#F9F9F9] rounded-[10px]" type="text" placeholder="Full Name * "><br><br>
                <p>Email address *</p><br>
                <input class="w-[246px] h-[50px] px-[10px] bg-[#F9F9F9] rounded-[10px]" type="text" placeholder="example@gmail.com  "><br><br>
                <p>Departement *</p><br>
                <select class="w-[248px] h-[50px] bg-[#F9F9F9] px-[10px] text-gray-400 rounded-[10px]">
                    <option>Please Select</option>
                    <option>Please Select</option>
                    <option>Please Select</option>
                </select><br><br>
                <p>Time *</p><br>
                <select class="w-[248px] h-[50px] bg-[#F9F9F9] px-[10px] text-gray-400 mb-10 rounded-[10px]">
                    <option>4:00 Available</option>
                    <option>4:00 Available</option>
                    <option>4:00 Available</option>
                </select><br>
                <button class="w-[248px] h-[50px] bg-[#23A6F0] text-white rounded-[10px]">Book Appointment</button>
            </div>
